<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${cocktail.name}">칵테일 상세</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .container {
      max-width: 800px;
      margin-top: 50px;
    }
    .cocktail-image {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .ingredient-list {
      margin: 20px 0;
    }
    .stats {
      color: #666;
      font-size: 0.9em;
      margin: 15px 0;
    }
    .recipe-section {
      background-color: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .created-by {
      font-style: italic;
      color: #666;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="row mb-4">
    <div class="col">
      <h2 class="mb-3" th:text="${cocktail.name}">칵테일 이름</h2>
      <span class="badge bg-primary me-2" th:text="${cocktail.type}">타입</span>
    </div>
  </div>

  <div class="row">
    <div class="col-md-6">
      <img th:if="${cocktail.imageUrl}" th:src="${cocktail.imageUrl}"
           class="cocktail-image" alt="칵테일 이미지">
      <img th:unless="${cocktail.imageUrl}" src="/images/default-cocktail.jpg"
           class="cocktail-image" alt="기본 이미지">
    </div>

    <div class="col-md-6">
      <div class="stats">
        <p>
          <i class="bi bi-eye"></i> 조회수: <span th:text="${cocktail.viewCount}">0</span>
          <i class="bi bi-star-fill ms-3"></i> 평점: <span th:text="${cocktail.starRate}">0.0</span>
          <i class="bi bi-heart-fill ms-3"></i> 좋아요: <span th:text="${cocktail.likeCount}">0</span>
        </p>
      </div>

      <h4>설명</h4>
      <p th:text="${cocktail.description}">칵테일 설명</p>

      <h4>재료</h4>
      <div class="ingredient-list">
        <ul class="list-group">
          <li class="list-group-item" th:each="ingredient : ${cocktail.ingredientList}">
            <span th:text="${ingredient.name}">재료명</span>
            <span class="badge bg-secondary float-end"
                  th:text="${ingredient.category}">카테고리</span>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="recipe-section">
    <h4>레시피</h4>
    <p th:text="${cocktail.recipe}" style="white-space: pre-line;">레시피 설명</p>
  </div>

  <div class="created-by mt-4">
    <p>
      작성자: <span th:text="${cocktail.user.nickname}">작성자</span><br>
      작성일: <span th:text="${#temporals.format(cocktail.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</span><br>
      수정일: <span th:text="${#temporals.format(cocktail.modifiedAt, 'yyyy-MM-dd HH:mm')}">날짜</span>
    </p>
  </div>

  <div class="mt-4">
    <a href="/cocktails" class="btn btn-secondary">목록으로</a>
    <a th:if="${#authentication.principal != null && #authentication.principal.id == cocktail.user.id}"
       th:href="@{/cocktails/{id}/edit(id=${cocktail.id})}"
       class="btn btn-primary">수정</a>
    <button th:if="${#authentication.principal != null && #authentication.principal.id == cocktail.user.id}"
            class="btn btn-danger"
            onclick="deleteCocktail()">삭제</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>


  function deleteCocktail() {
    if (confirm('정말로 삭제하시겠습니까?')) {
      fetch(`/api/cocktails/${cocktail.id}`, {
        method: 'DELETE'
      })
      .then(response => response.json())
      .then(data => {
        if (data.success) {
          alert('칵테일이 삭제되었습니다.');
          window.location.href = '/cocktails';
        } else {
          alert('삭제에 실패했습니다: ' + data.message);
        }
      })
      .catch(error => {
        alert('오류가 발생했습니다: ' + error);
      });
    }
  }
</script>
</body>
</html>
